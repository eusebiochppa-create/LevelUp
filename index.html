<style>
:root{
  --bg:#F6F3EC; --surface:#FFFDF9; --surface2:#EEE9DF; --ink:#1E1E1C; --ink2:#55524C; --muted:#8A857B;
  --line:#E6DFD3; --beige:#E9E1D3; --accent:#7D9B80; --accent-strong:#55725A; --accent-soft:#E3EBE0;
  --danger:#A3584C; --now-bg:#1E1E1C; --now-ink:#F6F3EC; --now-muted:#A9A498;
  --radius:16px; --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-title:'Space Grotesk','Inter',system-ui,sans-serif; color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#141413; --surface:#1D1D1B; --surface2:#2A2926; --ink:#F1EDE5; --ink2:#C3BDB2; --muted:#8E897F;
  --line:#2E2D2A; --beige:#3A3631; --accent:#93B196; --accent-strong:#7FA083; --accent-soft:#243028;
  --danger:#D08476; --now-bg:#2A3A2E; --now-ink:#F1EDE5; --now-muted:#AFC0B0; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 104px) max(20px,env(safe-area-inset-left))}
.enter{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.narrow{max-width:640px;margin:0 auto}
.top{margin:4px 0 20px}
.brand{display:flex;align-items:center;gap:9px;font:600 12px/1 var(--font-title);letter-spacing:.16em;color:var(--ink2);margin-bottom:22px}
.brand svg{width:24px;height:24px;border-radius:7px;flex:none;box-shadow:0 0 0 1px var(--line)}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h1{font:600 30px/1.15 var(--font-title);letter-spacing:-.02em;margin:6px 0 0}
.h2{font:600 18px/1.3 var(--font-title);letter-spacing:-.01em;margin:0}
.h3{font:600 16px/1.3 var(--font-title);margin:0}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.4}
.xs{font-size:12px}
.mt{margin-top:12px}.mt-s{margin-top:6px}.mb{margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar.thin{height:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .45s ease}
.big{font:600 40px/1 var(--font-title);letter-spacing:-.03em}
.big span{font-size:20px;color:var(--muted);margin-left:2px}
.note{font-size:14px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);padding:3px 8px;border-radius:99px;vertical-align:middle}
.tag.plain{color:var(--ink2);background:var(--surface2)}
.save-status{text-align:center;font-size:12px;color:var(--muted);margin:24px 0 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.save-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
.save-status.err::before{background:var(--danger)}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;color:var(--ink2);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.28}
.iconbtn.danger{color:var(--danger)}
.iconbtn.armed{background:var(--danger);color:#fff}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;color:var(--ink2);font-size:15px;margin:-8px 0 2px -6px;padding-right:8px}
.back svg{width:20px;height:20px}
/* Segmentado */
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;margin-bottom:16px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink2);text-align:center;transition:background .15s}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
/* Casillas */
.list{display:flex;flex-direction:column}
.crow{display:flex;align-items:flex-start;gap:14px;width:100%;min-height:44px;padding:10px 0;border-top:1px solid var(--line)}
.list>.crow:first-child{border-top:0}
.cbox{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.cbox svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s;color:#fff}
.crow.on .cbox{background:var(--accent);border-color:var(--accent)}
.crow.on .cbox svg{opacity:1;transform:none}
.crow:disabled .cbox{opacity:.35}
.ctext{flex:1;min-width:0;display:flex;flex-direction:column}
.clabel{transition:color .15s;overflow-wrap:anywhere}
.crow.on .clabel{text-decoration:line-through;color:var(--muted)}
.cdetail{font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.crow.on .cdetail{opacity:.6}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.empty-state{text-align:center;padding:28px 12px}
.empty-state .h3{margin-bottom:6px}
.empty-state .btn{margin-top:14px}
/* Inputs */
.field{display:block;margin-bottom:12px}
.field>span,.flabel{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:500}
input[type=text],input[type=url],input[type=number],input[type=time],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text],input[type=url],input[type=number],textarea,select{-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:none;line-height:1.45;min-height:68px;overflow:hidden;display:block}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err-text{color:var(--danger);font-size:14px;margin:-6px 0 10px}
/* Inicio */
.now{background:var(--now-bg);color:var(--now-ink);border-color:var(--now-bg);padding:20px}
.now .eyebrow{color:var(--now-muted)}
.now-title{font:600 22px/1.25 var(--font-title);letter-spacing:-.01em;margin:8px 0 2px}
.now-sub{color:var(--now-muted);font-size:14px}
.now .btnrow{margin-top:16px}
.now .btn{background:var(--now-ink);color:var(--now-bg);border-color:var(--now-ink)}
.now .btn.ghost{background:transparent;color:var(--now-ink);border-color:rgba(255,255,255,.18)}
.now-empty{font:500 17px/1.4 var(--font-title);margin-top:8px}
.prio{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0}
.prio .crow{width:auto;border:0;padding:10px 0;flex:none}
.prio input{border:0;background:transparent;padding:10px 0;border-radius:0;box-shadow:none!important}
.prio.on input{text-decoration:line-through;color:var(--muted)}
.suggest{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:4px 4px 4px 12px}
.trow{display:flex;align-items:center;gap:14px;width:100%;min-height:44px;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .time{font:500 14px/1 var(--font-title);color:var(--muted);width:46px;flex:none}
.trow .ttitle{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chip svg{width:14px;height:14px;color:var(--muted)}
.quote{font:500 17px/1.45 var(--font-title);color:var(--ink2);text-align:center;margin:26px 8px 22px;letter-spacing:-.005em}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.qbtn svg{width:20px;height:20px;color:var(--accent-strong);flex:none}
/* Rutinas */
.block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.block-head .time{font:600 15px/1 var(--font-title);color:var(--accent-strong);min-width:44px}
.block-head .h3{flex:1}
.journal{margin-top:12px;padding-top:14px;border-top:1px dashed var(--line)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.strip i{display:block;aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.strip i.off{background:transparent;border:1px dashed var(--line)}
.jrow{display:block;width:100%;min-height:44px;padding:10px 0;border-top:1px solid var(--line)}
.jrow:first-child{border-top:0}
.jrow .muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jrow .muted.wrap{white-space:normal}
/* Edición */
.erow{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.elist>.erow:first-child{border-top:0;padding-top:4px}
.erow input.sub{font-size:16px;color:var(--ink2)}
.erow-actions{display:flex;gap:2px;align-items:center}
.erow-actions select{flex:1;min-width:0;margin-left:6px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;text-align:center}
.daypick button[aria-pressed=true]{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.edit-block{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.edit-block .grid2{grid-template-columns:110px 1fr}
.edit-bar{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
/* Hábitos */
.habit{padding:12px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0;padding-top:2px}
.habit-name{min-height:44px;display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0}
.habit-name .h3{font-family:var(--font-ui);font-weight:500;font-size:16px}
.count{font:600 15px/1 var(--font-title);color:var(--muted);white-space:nowrap}
.count.met{color:var(--accent-strong)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.dayb{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.dayb .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.dayb .dot svg{width:14px;height:14px;color:#fff}
.dayb.on .dot{background:var(--accent);border-color:var(--accent)}
.dayb.today{color:var(--ink)}
.dayb.today .dot{border-color:var(--ink2);border-width:2px}
.dayb.today.on .dot{border-color:var(--accent-strong)}
.dayb:disabled{opacity:.35}
.wkrow{display:grid;grid-template-columns:96px 1fr 56px;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.wkrow .bar{margin:0}
/* Limpieza */
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.day-head .h3{flex:1}
.extras>li{padding:12px 0;border-top:1px solid var(--line)}
.extras>li:first-child{border-top:0}
.extras>li.active{background:var(--accent-soft);border-radius:12px;padding:12px;border-top-color:transparent;margin:4px -6px}
.extras>li.active+li{border-top-color:transparent}
.xw{font-weight:600;font-size:15px;margin-bottom:4px}
.xw .hl{color:var(--accent-strong);font-weight:500}
.extras ul li{font-size:15px;padding:2px 0}
/* Más */
.navrow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 0;border-top:1px solid var(--line)}
.navrow:first-child{border-top:0}
.navrow>svg:first-child{width:22px;height:22px;color:var(--accent-strong);flex:none}
.navrow>svg:last-child{width:18px;height:18px;color:var(--muted);flex:none}
.navrow .nt{flex:1;display:flex;flex-direction:column}
/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabbar-inner{max-width:720px;margin:0 auto;display:flex}
.tab{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);position:relative;text-align:center}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page]::after{content:'';position:absolute;top:-1px;width:22px;height:2px;background:var(--accent);border-radius:2px}
/* Hoja */
.sheet-backdrop{position:fixed;inset:0;background:rgba(18,18,16,.38);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:41;padding:6px 20px calc(env(safe-area-inset-bottom) + 22px)}
.sheet.anim{animation:up .26s ease}
.sheet-backdrop.anim{animation:fadeIn .2s ease}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-6px;background:var(--surface);padding:10px 0 8px;z-index:2;margin-bottom:6px}
.sheet-head .h2{flex:1}
@media (min-width:700px){.sheet{bottom:auto;top:7vh;border-radius:22px;max-height:86vh}}
/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== Fase 2 ===== */
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(env(safe-area-inset-bottom) + 72px);width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:25;transition:transform .15s}
.fab:active{transform:scale(.96)}
.fab svg{width:26px;height:26px}
.fab[hidden],body.sheet-open .fab{display:none}
.toast{display:flex;align-items:center;gap:6px}
.toast.show{pointer-events:auto}
.toast-btn{font-weight:600;color:var(--accent);min-height:36px;padding:0 4px;margin-left:4px}
:root[data-theme=dark] .toast-btn{color:var(--accent-strong)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 12px;padding:2px 20px}
.hscroll::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap;color:var(--ink2)}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .fchip{flex:initial}
.titem{display:flex;align-items:flex-start;border-top:1px solid var(--line)}
.titem:first-child{border-top:0}
.tcheck{width:44px;min-height:44px;display:grid;place-items:center;margin-left:-10px;flex:none;padding-top:0}
.tcheck .kdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tbody{flex:1;min-width:0;padding:10px 0;min-height:44px;display:flex;flex-direction:column}
.ttl{overflow-wrap:anywhere}
.titem.on .ttl{text-decoration:line-through;color:var(--muted)}
.titem.on .cbox{background:var(--accent);border-color:var(--accent)}
.titem.on .cbox svg{opacity:1;transform:none}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.meta .late,.late{color:var(--danger)}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.p-urgente{background:var(--danger)}.p-importante{background:var(--accent-strong)}.p-cuando{background:var(--muted);opacity:.5}
.p-alta{background:var(--danger)}.p-media{background:var(--accent-strong)}.p-baja{background:var(--muted);opacity:.5}
.group-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 2px 8px}
.group-title:first-child{margin-top:4px}
.group-title.late{color:var(--danger)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.head-row .btnrow{flex:none}
.timefield{display:flex;gap:6px;align-items:center}
.timefield input{flex:1}
/* Agenda */
.ag-nav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.ag-nav .lbl{flex:1;text-align:center;font:600 16px/1.3 var(--font-title)}
.allday{margin-bottom:12px}
.timeline{position:relative;margin-left:50px;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.hr span{position:absolute;left:-50px;top:-9px;width:42px;text-align:right;font-size:11px;color:var(--muted)}
.ev{position:absolute;border-radius:9px;background:var(--accent-soft);border-left:3px solid var(--accent);padding:4px 8px;font-size:13px;line-height:1.25;overflow:hidden;text-align:left;color:var(--ink)}
.ev small{display:block;color:var(--muted);font-size:11px}
.ev.done{opacity:.5}.ev.done b{text-decoration:line-through}
.ev.k-evento{background:var(--surface2);border-left-color:var(--ink2)}
.ev.k-entreno{border-left-color:var(--accent-strong)}
.ev.k-tarea{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--danger)}
.nowline{position:absolute;left:-5px;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.nowline::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mhead{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding:4px 0}
.mcell{min-height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;font-size:14px;text-align:center}
.mcell.out{opacity:.38}
.mnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.mcell.today .mnum{background:var(--ink);color:var(--bg);font-weight:600}
.mdots{display:flex;gap:3px;height:6px}.mdots i{width:5px;height:5px;border-radius:50%}.mdots i:not(.st){background:var(--accent)}
.k-tag{font-size:11px;color:var(--muted)}
/* Fitness */
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2);margin-top:10px}
.kv b{font-weight:600;color:var(--ink)}
.bars8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:96px;margin-top:12px}
.bars8 .bc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars8 .b{width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bars8 .b.zero{background:var(--surface2)}
.bars8 .lb{font-size:10px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cmp>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.diff{font:600 15px var(--font-title);margin-top:10px}
.diff.up{color:var(--accent-strong)}.diff.down{color:var(--danger)}
/* Wishlist */
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.wgrid{grid-template-columns:repeat(3,1fr)}}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.wimg{aspect-ratio:4/5;background:var(--surface2);display:grid;place-items:center;font:600 30px var(--font-title);color:var(--muted);overflow:hidden;width:100%}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wthumb{width:44px;height:44px;border-radius:10px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;font:600 17px var(--font-title);color:var(--muted)}
.wthumb img{width:100%;height:100%;object-fit:cover}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column}
.wright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-weight:500;white-space:nowrap}
.selrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.selrow select{padding:8px 26px 8px 10px;font-size:16px}
.budget{font-size:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.imgprev{width:96px;height:120px;border-radius:12px;overflow:hidden;background:var(--surface2);margin-bottom:8px}
.imgprev img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.choice{display:flex;flex-direction:column;gap:10px}
.choice .btn{justify-content:flex-start;min-height:60px;padding:0 16px}
.choice .btn span{display:flex;flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;text-align:left}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;width:100%;margin-bottom:10px;font-size:15px}
.switch .knob{width:46px;height:28px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.switch .knob::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked=true] .knob{background:var(--accent-strong);border-color:var(--accent-strong)}
.switch[aria-checked=true] .knob::after{transform:translateX(18px)}
/* ===== Fase 3 · Instagram ===== */
.fmt{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 5px;border-radius:6px;background:var(--surface2);color:var(--ink2);font:600 11px/1 var(--font-title);letter-spacing:.02em;flex:none}
.st{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.st-borrador{background:var(--muted);opacity:.45}.st-produccion{background:#C2AE8E}.st-listo{background:var(--accent)}.st-programado{background:var(--accent-strong)}.st-publicado{background:var(--ink)}
.st-pendiente{background:#C2AE8E}.st-completada{background:var(--accent)}.st-programada{background:var(--accent-strong)}.st-publicada{background:var(--ink)}
.igweek{display:flex;flex-direction:column}
.igrow{display:grid;grid-template-columns:58px 1fr 44px;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.igrow:first-child{border-top:0}
.igrow.today .igd b{color:var(--accent-strong)}
.igd{display:flex;flex-direction:column;padding-top:10px;line-height:1.15}
.igd b{font:600 15px var(--font-title)}
.igd span{font-size:12px;color:var(--muted)}
.pieces{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.piece{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%;text-align:left;min-width:0}
.piece .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.piece.pub .pt{color:var(--muted)}
.piece.pend{border-style:dashed}
.igempty{color:var(--muted);font-size:14px;padding-top:12px}
.mcell.sel{background:var(--accent-soft)}
.mdots i.st{width:6px;height:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.idea{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:44px}
.idea:first-child{border-top:0}
.idea .desc{display:block;color:var(--ink2);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.host{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* ===== Fase 4 ===== */
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font:600 11px/18px var(--font-ui);text-align:center}
.badge.inline{position:static;display:inline-block;vertical-align:1px;margin-left:4px}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .bar{grid-column:1/-1;margin-top:6px}
.rrow .val{font:600 15px var(--font-title);text-align:right}
.rrow .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.remrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.remrow:first-child{border-top:0}
.remrow .time{font:600 14px/1.4 var(--font-title);color:var(--accent-strong);width:44px;flex:none;padding-top:1px}
.remrow .rb{flex:1;min-width:0}
.remrow .btnrow{margin-top:8px}
.remrow .btn{min-height:44px;padding:0 12px;font-size:14px}
.notice{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-bottom:12px}
.catrow{border-top:1px solid var(--line);padding:4px 0}
.catrow:first-child{border-top:0}
.catrow .switch{margin:0}
.catcfg{padding:4px 0 14px}
.selitems{display:flex;flex-direction:column;margin-top:6px}
.backup{border-color:var(--beige);background:color-mix(in srgb,var(--beige) 35%,var(--surface))}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
textarea.code{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:160px;max-height:40vh;overflow:auto}
/* ===== Fase 5 ===== */
.viz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
:root[data-theme=dark] .viz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}
.sum{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font:600 19px/1.1 var(--font-title);letter-spacing:-.01em}
.ring .c span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.kvl{display:flex;flex-direction:column;gap:2px}
.kvl .setrow{min-height:34px;font-size:14px}
.kvl .setrow b{font-weight:600}
.linkbtn{min-height:44px;color:var(--accent-strong);font-weight:500;font-size:14px}
.chart6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:170px;margin-top:14px}
.chart6 .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;border-radius:8px;padding:0 2px}
.chart6 .col[aria-pressed=true]{background:var(--surface2)}
.chart6 .stack{width:70%;max-width:40px;display:flex;flex-direction:column-reverse;gap:2px}
.chart6 .stack i{display:block;width:100%;min-height:2px}
.chart6 .stack i:last-child{border-radius:4px 4px 0 0}
.chart6 .tot{font-size:11px;color:var(--ink2);white-space:nowrap}
.chart6 .mlb{font-size:11px;color:var(--muted);padding-bottom:4px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:12px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
.potrow{padding:12px 0;border-top:1px solid var(--line)}
.potrow:first-child{border-top:0}
.grid7{display:grid;grid-template-columns:72px repeat(7,1fr);gap:5px;align-items:center}
.grid7 .gl{font-size:13px;color:var(--ink2)}
.grid7 .gh{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.grid7 i{display:block;aspect-ratio:1;border-radius:6px;background:var(--surface2)}
.grid7 i.none{background:transparent;border:1px dashed var(--line)}
.focusbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px;margin-top:12px}
.focusbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.focusbars b{display:block;width:60%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.focusbars span{font-size:10px;color:var(--muted)}
/* ===== Fase 6 ===== */
.has-mic{position:relative}
.mic{position:absolute;top:-12px;right:-6px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.mic svg{width:19px;height:19px}
.mic.listening{color:#fff;background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}
.dict-partial{display:block;font-size:13px;color:var(--muted);font-style:italic;min-height:0;margin-top:4px}
.dict-partial:empty{display:none}
.calbtn{color:var(--accent-strong)}
.icsout{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
details.raw summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--ink2);font-size:14px}
.howto{font-size:14px;color:var(--ink2);border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0}
.asst-out{white-space:pre-wrap;font-size:15px;line-height:1.5;margin-top:10px}
.asst-item{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.asst-item:first-child{border-top:0}
.sendnote{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:8px 12px;margin:8px 0 12px}
.sendnote pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;margin:6px 0 0;max-height:140px;overflow:auto}
@media (min-width:760px){.h1{font-size:34px}#app{padding-top:36px}}

/* =====================================================
   ESTÉTICA APPLE (iOS) · acento verde salvia
   ===================================================== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#E9E9EE; --fill:rgba(118,118,128,.12); --fill2:#E9E9EA;
  --ink:#000000; --ink2:#48484A; --muted:#8E8E93; --line:#E5E5EA; --sep:#C6C6C8;
  --accent:#7D9B80; --accent-strong:#55725A; --accent-soft:#E4EDE5; --btn-fill:#55725A; --tint:#55725A;
  --danger:#FF3B30;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-title:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:#39393D;
  --ink:#FFFFFF; --ink2:#C7C7CC; --muted:#8E8E93; --line:#38383A; --sep:#38383A;
  --accent:#93B196; --accent-strong:#8DB092; --accent-soft:#1F2B21; --btn-fill:#5E7F63; --tint:#9DBCA0;
  --danger:#FF453A;
}
body{font-size:17px;line-height:1.4;letter-spacing:-.012em}
.h1{font:700 34px/1.12 var(--font-title);letter-spacing:.004em}
.h2{font:600 20px/1.25 var(--font-title);letter-spacing:.01em}
.h3{font:600 17px/1.3 var(--font-ui);letter-spacing:-.02em}
.small{font-size:15px;line-height:1.35}
.eyebrow{font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}

<script>
(function(){
'use strict';

/* =========================================================
   LEVEL UP · Fase 1
   Base de datos local, fechas ISO, navegación, módulos,
   Inicio (tarjeta Ahora), Rutinas, Hábitos y Limpieza.
   ========================================================= */

var KEY = 'levelup:data';
var VERSION = 1;

/* ---------- Utilidades ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function pct(d, t){ return t ? Math.round(d / t * 100) : 0; }

/* ---------- Fechas locales y semanas ISO ---------- */
function now(){ return window.__LU_NOW ? new Date(window.__LU_NOW) : new Date(); }
function pad(n){ return String(n).padStart(2, '0'); }

  var set = {}; days.forEach(function(x){ set[x] = 1; });

  if (n === 7) return 'Todos los días';

  return days.slice().sort(function(a, b){ return a - b; }).map(function(x){ return DOW_SHORT[x - 1]; }).join(', ');

/* Icono para la pantalla de inicio del iPhone (PNG generado con canvas) */
function makeTouchIcon(){
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var x = c.getContext('2d'); if (!x) return;
    x.fillStyle = '#1E1E1C'; x.fillRect(0, 0, 180, 180);
    var s = 180 / 64;
    x.lineCap = 'round'; x.lineJoin = 'round';
    x.strokeStyle = '#8FAF91'; x.lineWidth = 5 * s;
    x.beginPath(); x.moveTo(32 * s, 45 * s); x.lineTo(32 * s, 17 * s);
    x.moveTo(21 * s, 28 * s); x.lineTo(32 * s, 17 * s); x.lineTo(43 * s, 28 * s); x.stroke();
    x.strokeStyle = '#E9E1D3'; x.lineWidth = 3 * s;
    x.beginPath(); x.moveTo(21 * s, 51 * s); x.lineTo(43 * s, 51 * s); x.stroke();
    var link = document.getElementById('touchIcon');
    if (link) link.href = c.toDataURL('image/png');
  } catch (e) {}
}

var data, storageOk = true, saveTimer = null;
function load(){
  var raw = null, obj = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; }
  if (raw) {
    try { obj = JSON.parse(raw); }
    catch (e) { try { localStorage.setItem(KEY + ':dañado:' + Date.now(), raw); } catch (e2) {} obj = null; }
  }
  data = migrate(obj);
}
function save(){
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, JSON.stringify(data)); storageOk = true; }
  catch (e) { storageOk = false; }
  var st = document.querySelector('.save-status');
  if (st) { st.textContent = saveText(); st.classList.toggle('err', !storageOk); }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
function saveText(){ return storageOk ? 'Guardado en este dispositivo' : 'No se puede guardar en este dispositivo ahora mismo'; }

/* ---------- Fuentes ampliables (las fases siguientes añaden las suyas) ---------- */
var DAY_SOURCES = [];       /* fn(ds) -> {total, done, group} */
var WEEK_SOURCES = [];      /* fn(lunes) -> {total, done}: listas semanales */
var TIMELINE_SOURCES = [];  /* fn(ds) -> [items con hora] */
var UNTIMED_SOURCES = [];   /* fn(ds) -> item sin hora o null */

/* Casillas del día (porcentaje de Inicio) */
function dayStats(ds){
  var d = parseYmd(ds), groups = { plan:{ total:0, done:0 }, habitos:{ total:0, done:0 }, tareas:{ total:0, done:0 } };
  function add(g, t, dn){ groups[g].total += t; groups[g].done += dn; }
  var pr = prios(ds).filter(function(p){ return p.t && p.t.trim(); });
  add('plan', pr.length, pr.filter(function(p){ return p.done; }).length);
  var rc = rChecks(ds);
  if (morningDue(d)) { var mi = data.routines.morning.items; add('plan', mi.length, countDone(mi, rc)); }
  if (nightDue(d)) { var ni = nightItems(); add('plan', ni.length, countDone(ni, rc)); }
  var hc = hChecks(ds), mon = mondayOf(d);
  data.habits.forEach(function(h){
    if (h.freq === 'weekly') { if (hc[h.id]) add('habitos', 1, 1); else if (habitWeekCount(h, mon) < habitTarget(h)) add('habitos', 1, 0); }
    else add('habitos', 1, hc[h.id] ? 1 : 0);
  });
  if (on('limpieza')) { var ts = cleaningTasksFor(isoDow(d), d), cc = cChecks(weekKey(d)); add('plan', ts.length, countDone(ts, cc)); }
  DAY_SOURCES.forEach(function(fn){ var r = fn(ds); if (r) add(r.group || 'plan', r.total, r.done); });
  var total = 0, done = 0; Object.keys(groups).forEach(function(g){ total += groups[g].total; done += groups[g].done; });
  return { total:total, done:done, pct:pct(done, total), groups:groups };
}
/* Casillas de toda la semana (barra fina de Inicio) */
function weekStats(monday){
  var total = 0, done = 0;
  for (var i = 0; i < 7; i++) {
    var d = addDays(monday, i), ds = ymd(d), rc = rChecks(ds);
    var pr = prios(ds).filter(function(p){ return p.t && p.t.trim(); });
    total += pr.length; done += pr.filter(function(p){ return p.done; }).length;
    if (morningDue(d)) { total += data.routines.morning.items.length; done += countDone(data.routines.morning.items, rc); }
    if (nightDue(d)) { var ni = nightItems(); total += ni.length; done += countDone(ni, rc); }
    var hc = hChecks(ds);
    data.habits.forEach(function(h){ if (h.freq !== 'weekly') { total++; if (hc[h.id]) done++; } });
    DAY_SOURCES.forEach(function(fn){ var r = fn(ds); if (r) { total += r.total; done += r.done; } });
  }
  data.habits.forEach(function(h){ if (h.freq === 'weekly') { var t = habitTarget(h); total += t; done += Math.min(t, habitWeekCount(h, monday)); } });
  if (on('limpieza')) { var cs = cleaningWeekStats(monday); total += cs.total; done += cs.done; }
  WEEK_SOURCES.forEach(function(fn){ var r = fn(monday); if (r) { total += r.total; done += r.done; } });
  return { total:total, done:done, pct:pct(done, total) };
}

/* ---------- Línea de hoy y tarjeta "Ahora" ---------- */
function timelineToday(){
  var ds = today(), d = parseYmd(ds), rc = rChecks(ds), items = [];
  if (morningDue(d)) {
    var r = data.routines.morning, st = hm2min(r.time);
    if (st != null && r.items.length) items.push({
      key:'morning', title:'Rutina de mañana', kind:'Rutina', start:st, end:st + (+r.dur || 30),
      total:r.items.length, done:countDone(r.items, rc), go:'rutinas',
      complete:function(){ r.items.forEach(function(i){ setRCheck(ds, i.id, true); }); }
    });
  }
  if (nightDue(d)) {
    var bs = blocksSorted();
    bs.forEach(function(b, i){
      var s = hm2min(b.time); if (s == null || !b.items.length) return;
      var nx = bs[i + 1] ? hm2min(bs[i + 1].time) : null;
      var e = (nx != null && nx > s) ? nx : s + 30;
      items.push({
        key:'nb:' + b.id, title:b.title || 'Bloque de noche', kind:'Rutina de noche', start:s, end:e,
        total:b.items.length, done:countDone(b.items, rc), go:'noche',
        complete:function(){ b.items.forEach(function(it){ setRCheck(ds, it.id, true); }); }
      });
    });
  }
  TIMELINE_SOURCES.forEach(function(fn){ items = items.concat(fn(ds) || []); });
  return items.sort(function(a, b){ return a.start - b.start; });
}
function nowItem(){
  var nm = nowMin(), ds = today();
  var pending = timelineToday().filter(function(i){ return i.start != null && i.done < i.total; });
  for (var i = 0; i < pending.length; i++) if (pending[i].start <= nm && nm < pending[i].end) return { item:pending[i], state:'now' };
  for (var j = 0; j < pending.length; j++) if (pending[j].start > nm) return { item:pending[j], state:'next' };
  for (var k = 0; k < UNTIMED_SOURCES.length; k++) { var u = UNTIMED_SOURCES[k](ds); if (u) return { item:u, state:'untimed' }; }
  return null;
}

function vInicio(){

       '<p class="eyebrow">' + esc(fmtLong(d)) + '</p><h1 class="h1">' + greeting(d) + (name ? ', ' + esc(name) : '') + '</h1></header>';
  h += cardAhora();

  h += cardReminders();
  h += '<section class="card" aria-label="Progreso"><div class="split"><div><div class="big">' + st.pct + '<span>%</span></div>' +

  if (on('limpieza')) q.push(['limpieza', ICON.clean, 'Limpieza']);
  if (on('agenda')) q.push(['agenda', ICON.calendar, 'Agenda']);
  if (on('tareas')) q.push(['tareas', ICON.tasks, 'Tareas']);

function cardAhora(){
  var n = nowItem();
  if (!n) return '<section class="card now" aria-label="Ahora"><span class="eyebrow">Ahora</span><p class="now-empty">Nada pendiente. Buen trabajo.</p></section>';
  var it = n.item, when = '';
  if (n.state === 'now') when = 'En curso · hasta las ' + min2hm(it.end);
  else if (n.state === 'next') when = 'Empieza a las ' + min2hm(it.start);
  else when = 'Sin hora · hoy';
  var prog = it.total > 1 ? ' · ' + it.done + ' de ' + it.total + ' hecho' : '';
  return '<section class="card now" aria-label="Ahora"><div class="split"><span class="eyebrow">Ahora</span>' +
    (it.start != null ? '<span class="eyebrow">' + min2hm(it.start) + ' – ' + min2hm(it.end) + '</span>' : '') + '</div>' +
    '<h2 class="now-title">' + esc(it.title) + '</h2><p class="now-sub">' + esc(it.kind) + ' · ' + when + prog + '</p>' +
    '<div class="btnrow"><button class="btn" data-act="now-done">' + ICON.tick + 'Hecho</button>' +
    (it.go ? '<button class="btn ghost" data-act="go" data-to="' + it.go + '">Abrir</button>' : '') + '</div></section>';
}
function cardPriorities(ds){
  var ps = prios(ds), h = '<section class="card" aria-label="Prioridades del día"><div class="section-head"><h2 class="h2">3 prioridades</h2></div><div>';
  ps.forEach(function(p, i){
    var has = !!(p.t && p.t.trim());
    h += '<div class="prio' + (p.done && has ? ' on' : '') + '">' +
      '<button class="crow' + (p.done && has ? ' on' : '') + '" role="checkbox" aria-checked="' + !!(p.done && has) + '" aria-label="Completar prioridad ' + (i + 1) + '" data-act="prio-check" data-i="' + i + '"' + (has ? '' : ' disabled') + '><span class="cbox">' + ICON.tick + '</span></button>' +
      '<input type="text" maxlength="120" value="' + esc(p.t) + '" placeholder="Prioridad ' + (i + 1) + '" aria-label="Prioridad ' + (i + 1) + '" data-in="prio" data-i="' + i + '" enterkeyhint="done"></div>';
  });
  h += '</div>';
  var y = data.journal[ymd(addDays(parseYmd(ds), -1))];
  var empty = ps.every(function(p){ return !(p.t && p.t.trim()); });
  if (empty && y && y.tomorrow && y.tomorrow.trim()) {

}
function cardLater(){
  var nm = nowMin(), n = nowItem(), cur = n && n.item;

  if (!later.length) return '';
  return '<section class="card" aria-label="Más tarde hoy"><div class="section-head"><h2 class="h2">Más tarde hoy</h2></div><div>' +
    later.map(function(i){ return '<button class="trow" data-act="go" data-to="' + i.go + '"><span class="time">' + min2hm(i.start) + '</span><span class="ttitle">' + esc(i.title) + '</span><span class="muted small">' + i.done + '/' + i.total + '</span></button>'; }).join('') +

  h += '<div class="bar thin"><i style="width:' + pct(done, hs.length) + '%"></i></div>';

  else h += '<div class="chips">' + pending.slice(0, 6).map(function(x){ return '<button class="chip" data-act="habit-toggle" data-id="' + x.id + '" data-date="' + ds + '" aria-label="Marcar ' + esc(x.name) + '">' + ICON.plus + esc(x.name) + '</button>'; }).join('') +

/* ---------- Edición: limpiar vacíos al pulsar Listo ---------- */
function finishEdit(what){
  if (what === 'morning') {
    var r = data.routines.morning;
    r.items = r.items.filter(function(i){ return i.text.trim(); });
    if (!hm2min(r.time) && hm2min(r.time) !== 0) r.time = '06:30';
    r.dur = Math.max(5, Math.min(240, parseInt(r.dur, 10) || 30));
  } else if (what === 'night') {
    var n = data.routines.night;
    n.blocks.forEach(function(b){ b.items = b.items.filter(function(i){ return i.text.trim(); }); if (hm2min(b.time) == null) b.time = '21:00'; });
    n.blocks = n.blocks.filter(function(b){ return b.title.trim() || b.items.length || b.journal; });
    n.blocks.forEach(function(b){ if (!b.title.trim()) b.title = 'Bloque'; });
    n.blocks.sort(function(a, b){ return hm2min(a.time) - hm2min(b.time); });
  } else if (what === 'cleaning') {
    var c = data.cleaning;
    Object.keys(c.days).forEach(function(k){ c.days[k] = c.days[k].filter(function(t){ return t.name.trim(); }); });
    Object.keys(c.extras).forEach(function(k){ c.extras[k] = c.extras[k].filter(function(t){ return t.name.trim(); }); });
  } else if (what && what.indexOf('igcl:') === 0) {
    var cl = byId(data.instagram.checklists, what.slice(5));
    if (cl) cl.items = cl.items.filter(function(i){ return i.text.trim(); });
  }
  save();
}

/* ---------- Búsquedas en listas editables ---------- */
function findRItem(id){
  var m = data.routines.morning.items;
  for (var i = 0; i < m.length; i++) if (m[i].id === id) return { list:m, idx:i };
  var bs = data.routines.night.blocks;
  for (var b = 0; b < bs.length; b++) for (var j = 0; j < bs[b].items.length; j++) if (bs[b].items[j].id === id) return { list:bs[b].items, idx:j };
  return null;
}
function findBlock(id){ var bs = data.routines.night.blocks; for (var i = 0; i < bs.length; i++) if (bs[i].id === id) return bs[i]; return null; }
function findCTask(id){
  var c = data.cleaning, scopes = [['day', c.days], ['extra', c.extras]];
  for (var s = 0; s < scopes.length; s++) {
    var obj = scopes[s][1];
    for (var k in obj) { var l = obj[k]; for (var i = 0; i < l.length; i++) if (l[i].id === id) return { list:l, idx:i, scope:scopes[s][0], key:+k }; }
  }
  return null;
}
function moveIn(list, idx, dir){ var j = idx + dir; if (j < 0 || j >= list.length) return; var t = list[idx]; list[idx] = list[j]; list[j] = t; }

/* Doble confirmación: primera pulsación avisa, segunda (antes de 4 s) ejecuta */
function arm(el){
  el.classList.add('armed'); el.dataset.orig = el.innerHTML; el.textContent = el.dataset.confirm || '¿Seguro? Pulsa otra vez';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ if (!document.body.contains(el)) return; el.classList.remove('armed'); el.innerHTML = el.dataset.orig; }, 4000);
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm !== undefined && !el.classList.contains('armed')) { e.preventDefault(); arm(el); return; }
  if (el.classList.contains('armed')) { clearTimeout(el._t); }
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); if (el.closest('#view')) state.lastFocus = null; try { fn(el.dataset, el, e); } catch (err) { console.error(err); toast('Algo ha fallado. Inténtalo de nuevo.'); } }
});
document.addEventListener('input', function(e){
  var el = e.target.closest('[data-in]'); if (!el) return;
  if (el.tagName === 'TEXTAREA') autosize(el);
  var fn = IN[el.dataset.in]; if (fn) fn(el.dataset, el.value, el, e);
});
document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.rerenderInput) { renderSheet(); return; }
  var el = e.target.closest('[data-ch]'); if (!el) return;
  var fn = CH[el.dataset.ch]; if (fn) fn(el.dataset, el.value, el, e);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && state.sheet) { closeSheet(); render(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type=text]')) {
    if (state.sheet && state.sheet.kind === 'habitForm') { e.preventDefault(); ACT['habit-save'](); }
    else if (state.sheet && state.sheet.kind === 'task' && !state.sheet.ask && e.target.dataset.f === 'title') { e.preventDefault(); ACT['task-save'](); }
    else e.target.blur();
  }
});
document.addEventListener('focusin', function(e){ if (state.sheet && e.target.closest && e.target.closest('#view')) { /* mantiene el foco dentro de la hoja */ var f = $('#sheetRoot .sheet button, #sheetRoot .sheet input'); if (f) f.focus(); } });
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') render(); else if (saveTimer) save(); });
window.addEventListener('pagehide', function(){ if (saveTimer) save(); });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

   FASE 2 · Fitness, Agenda, Tareas y Wishlist

/* ---------- Utilidades comunes ---------- */
function byId(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function idxById(list, id){ for (var i = 0; i < list.length; i++) if (list[i].id === id) return i; return -1; }
function tomorrowDs(){ return ymd(addDays(parseYmd(today()), 1)); }
function dateLabel(ds){
  var t = today();
  if (ds === t) return 'Hoy';
  if (ds === tomorrowDs()) return 'Mañana';
  if (ds === ymd(addDays(parseYmd(t), -1))) return 'Ayer';
  var d = parseYmd(ds), s = cap(fmtShort(d));
  return d.getFullYear() !== now().getFullYear() ? s + ' ' + d.getFullYear() : s;
}
function money(v){
  if (v == null || v === '' || isNaN(v)) return '';
  if (data.settings.privateMode) return '•••• €';
  return new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits:2 }).format(v);
}
function parseNum(s){
  s = String(s == null ? '' : s).trim().replace(/[€\s]/g, '');
  if (!s) return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); /* 1.500 = mil quinientos */
  var n = Number(s);
  return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
}
function numStr(v){ return v == null || v === '' ? '' : String(v).replace('.', ','); }
function validUrl(s){ try { var u = new URL(s); return (u.protocol === 'http:' || u.protocol === 'https:') && u.hostname.indexOf('.') > 0; } catch (e) { return false; } }
function setPath(o, p, v){ var k = p.split('.'); for (var i = 0; i < k.length - 1; i++) o = o[k[i]] || (o[k[i]] = {}); o[k[k.length - 1]] = v; }
function getPath(o, p){ return p.split('.').reduce(function(a, k){ return a == null ? a : a[k]; }, o); }
function removeLog(id){ if (!id) return; for (var i = data.log.length - 1; i >= 0; i--) if (data.log[i].id === id) { data.log.splice(i, 1); return; } }
function fmtKm(v){ return numStr(Math.round(v * 10) / 10) + ' km'; }
function startOf(x){ var m = hm2min(x); return m == null ? 9999 : m; }
function lastDayOfMonth(y, m){ return new Date(y, m + 1, 0).getDate(); }
function switchBtn(label, checked, act, attrs){ return '<button class="switch" role="switch" aria-checked="' + !!checked + '" data-act="' + act + '" ' + (attrs || '') + '><span>' + label + '</span><span class="knob"></span></button>'; }
function chipsPick(field, options, value, act){
  return '<div class="chips">' + options.map(function(o){ return '<button class="fchip" aria-pressed="' + (o[0] === value) + '" data-act="' + (act || 'form-set') + '" data-f="' + field + '" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>';
}

/* ---------- Deshacer ---------- */
var UNDO = { tareas: [], otros: [] };
function pushUndo(screen, entry){
  entry.screen = screen;
  var s = UNDO[screen] || (UNDO[screen] = []);
  s.push(entry); while (s.length > 10) s.shift();
  toastUndo(entry.msg || 'Hecho', entry);
}
function runUndo(entry){
  var s = UNDO[entry.screen] || [], i = s.indexOf(entry);
  if (i < 0) return;
  s.splice(i, 1);
  try { entry.undo(); } catch (e) { console.error(e); }
  hideToast(); save(); render(); toast('Deshecho');
}
function toastUndo(msg, entry){
  var t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + ' ·</span><button class="toast-btn" data-act="undo-toast">Deshacer</button>';
  state.toastEntry = entry; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $('#toast').classList.remove('show'); state.toastEntry = null; }

/* ---------- Fitness ---------- */
function fitTypeName(id){ var t = byId(data.fitness.types, id); return t ? t.name : 'Entreno'; }
function fitLabel(x){ return fitTypeName(x.type) + (x.name ? ' · ' + x.name : ''); }
function fitPlanFor(d){ return data.fitness.plan[isoDow(d)] || []; }
function sessionFor(planId, ds){ var s = data.fitness.sessions; for (var i = 0; i < s.length; i++) if (s[i].planId === planId && s[i].date === ds) return s[i]; return null; }
function togglePlanSession(p, ds){
  var s = sessionFor(p.id, ds);
  if (s) { data.fitness.sessions.splice(data.fitness.sessions.indexOf(s), 1); logEvt('entreno', p.id, ds, false); }
  else {
    data.fitness.sessions.push({ id:'s' + uid(), planId:p.id, type:p.type, name:p.name, date:ds, dur:+p.dur || 60, dist:null, notes:'', done:true, createdAt:Date.now() });
    logEvt('entreno', p.id, ds, true);
  }
}
function findFP(id){
  var pl = data.fitness.plan;
  for (var d = 1; d <= 7; d++) { var l = pl[d] || []; for (var i = 0; i < l.length; i++) if (l[i].id === id) return { list:l, idx:i, day:d }; }
  return null;
}
function sessionsInWeek(monday){
  var a = ymd(monday), b = ymd(addDays(monday, 6));
  return data.fitness.sessions.filter(function(s){ return s.done && s.date >= a && s.date <= b; });
}
function fitWeekStats(monday){
  var planned = 0; for (var d = 1; d <= 7; d++) planned += (data.fitness.plan[d] || []).length;
  var ss = sessionsInWeek(monday), byType = {}, mins = 0, km = 0, runs = 0;
  ss.forEach(function(s){
    byType[s.type] = (byType[s.type] || 0) + 1;
    mins += +s.dur || 0;
    if (s.type === 'run') { runs++; km += +s.dist || 0; }
  });
  return { planned:planned, done:ss.length, byType:byType, mins:mins, km:km, runs:runs };
}
function fitStreak(){
  var mon = mondayOf(now()), n = 0;
  if (sessionsInWeek(mon).length) n = 1;
  for (var k = 1; k < 520; k++) { if (sessionsInWeek(addDays(mon, -7 * k)).length) n++; else break; }
  return n;
}

/* ---------- Agenda (planificador) ---------- */
function kindLabel(k){ for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === k) return KINDS[i][1]; return 'Otro'; }
function plannerFor(d){ var dow = isoDow(d); return data.planner.items.filter(function(i){ return i.day === dow; }).sort(function(a, b){ return startOf(a.start) - startOf(b.start); }); }
function pChecks(ds){ return data.planner.checks[ds] || {}; }
function setPCheck(ds, id, val){
  var m = data.planner.checks[ds] || (data.planner.checks[ds] = {});
  if (!!m[id] === !!val) return;
  if (val) m[id] = true; else delete m[id];
  if (!Object.keys(m).length) delete data.planner.checks[ds];
  logEvt('agenda', id, ds, val);
}
var AGENDA_SOURCES = []; /* fases siguientes (Instagram) */
/* Todo lo que ocurre un día: actividades, entrenos, eventos, tareas con hora y wishlist */
function agendaItems(ds){
  var d = parseYmd(ds), out = [];
  if (on('agenda')) {
    var pc = pChecks(ds);
    plannerFor(d).forEach(function(a){
      var s = hm2min(a.start);
      out.push({ key:'pa:' + a.id, kind:'agenda', kindName:kindLabel(a.kind), title:a.name, start:s, end:s != null ? s + (+a.dur || 60) : null, done:!!pc[a.id], checkable:true,
        toggle:function(){ setPCheck(ds, a.id, !pChecks(ds)[a.id]); }, edit:{ act:'activity-edit', id:a.id }, go:'agenda' });
    });
    data.planner.events.forEach(function(e){
      if (e.date !== ds) return;
      var s = hm2min(e.start), en = hm2min(e.end);
      out.push({ key:'ev:' + e.id, kind:'evento', kindName:'Evento', title:e.title, start:s, end:en != null && en > s ? en : (s != null ? s + 60 : null), done:!!e.done, checkable:true,
        toggle:function(){ e.done = !e.done; logEvt('evento', e.id, ds, e.done); }, edit:{ act:'event-edit', id:e.id }, go:'agenda' });
    });
  }
  if (on('fitness')) {
    fitPlanFor(d).forEach(function(p){
      var s = hm2min(p.time);
      out.push({ key:'fp:' + p.id, kind:'entreno', kindName:'Entreno', title:fitLabel(p), start:s, end:s != null ? s + (+p.dur || 60) : null, done:!!sessionFor(p.id, ds), checkable:true,
        toggle:function(){ togglePlanSession(p, ds); }, edit:{ act:'fit-edit-plan', id:p.id }, go:'fitness' });
    });
    data.fitness.sessions.forEach(function(x){
      if (x.planId || x.date !== ds) return;
      out.push({ key:'fs:' + x.id, kind:'entreno', kindName:'Entreno', title:fitLabel(x), start:null, end:null, done:!!x.done, checkable:true,
        toggle:function(){ x.done = !x.done; logEvt('entreno', x.id, ds, x.done); }, edit:{ act:'session-edit', id:x.id }, go:'fitness' });
    });
  }
  if (on('tareas')) {
    data.tasks.forEach(function(t){
      if (t.date !== ds || !t.time) return;
      var s = hm2min(t.time);
      out.push({ key:'tk:' + t.id, kind:'tarea', kindName:'Tarea', title:t.title, start:s, end:s + 30, done:!!t.done, checkable:true,
        toggle:function(){ toggleTask(t.id); }, edit:{ act:'task-edit', id:t.id }, go:'tareas' });
    });
  }

/* Próxima fecha de una repetición, en hora local, con fin de mes y de año resueltos */
function nextRepeatDate(series, fromDs){
  var rep = series.rep || {}, d = parseYmd(fromDs), nd = null, guard = 0;
  function step(x){
    if (rep.type === 'daily') return addDays(x, 1);
    if (rep.type === 'ndays') return addDays(x, Math.max(1, parseInt(rep.n, 10) || 1));
    if (rep.type === 'weekly') {
      var days = rep.days && rep.days.length ? rep.days : [isoDow(parseYmd(series.start || fromDs))];
      for (var i = 1; i <= 7; i++) { var y = addDays(x, i); if (days.indexOf(isoDow(y)) >= 0) return y; }
      return addDays(x, 7);
    }
    if (rep.type === 'monthly') {
      var yy = x.getFullYear(), mm = x.getMonth() + 1; if (mm > 11) { mm = 0; yy++; }
      var dom = series.dom || parseYmd(series.start || fromDs).getDate();
      return new Date(yy, mm, Math.min(dom, lastDayOfMonth(yy, mm)));
    }
    return null;
  }
  nd = step(d);
  var td = today();
  while (nd && ymd(nd) < td && guard++ < 2000) nd = step(nd); /* no crea ocurrencias atrasadas */
  if (!nd) return null;
  if (series.until && ymd(nd) > series.until) return null;
  return ymd(nd);
}

}

  var open = data.tasks.some(function(x){ return x.seriesId === s.id && !x.done && x.id !== t.id; });
  if (open) return null; /* nunca duplica */
  var nd = nextRepeatDate(s, t.date || today());

  var n = newOccurrence(s, nd); data.tasks.push(n); return n;
}

  } });
}
function uncompleteTask(t){

  t.done = false; t.doneAt = null; t.doneDate = null;

  if (prev.spawnedId) { ri = idxById(data.tasks, prev.spawnedId); var y = data.tasks[ri]; if (y && !y.done && !y.edited) { removed = data.tasks.splice(ri, 1)[0]; } }

    var x = byId(data.tasks, id); if (x) { x.done = true; x.doneAt = prev.doneAt; x.doneDate = prev.doneDate; x.spawnedId = removed ? removed.id : null; }

function deleteTask(id, scope){

}

/* ---------- Acciones de la fase 2 ---------- */
function sheetForm(){ return state.sheet && state.sheet.form; }
function sheetError(msg, fid){ state.sheet.error = msg; renderSheet(); if (fid) { var i = $('[data-fid="' + fid + '"]'); if (i) i.focus(); } }
function closeAndCommit(msg){ state.sheet = null; renderSheet(); if (msg) toast(msg); commit(); }
function saveTask(scope){
  var s = state.sheet, f = s.form, title = String(f.title || '').trim();
  if (!title) return sheetError('Escribe la tarea.', 'f-title');
  var area = f.area;
  if (area === '__new') {
    area = String(f.newArea || '').trim();
    if (!area) return sheetError('Escribe el nombre de la nueva área.');
    if (data.taskAreas.indexOf(area) < 0) data.taskAreas.push(area);
  }
  var td = today(), date = null, week = null;
  if (f.dayMode === 'today') date = td;
  else if (f.dayMode === 'tomorrow') date = tomorrowDs();
  else if (f.dayMode === 'date') { if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date || '')) return sheetError('Elige una fecha válida.'); date = f.date; }
  else if (f.dayMode === 'week') week = weekKey(now());
  var rep = clone(f.rep); rep.n = Math.max(1, parseInt(rep.n, 10) || 1);
  if (rep.type === 'weekly' && !rep.days.length) return sheetError('Elige al menos un día para la repetición semanal.');
  if (rep.type !== 'none' && !date) { date = td; week = null; }
  if (rep.until && date && rep.until < date) return sheetError('La fecha de fin es anterior a la tarea.');
  var fields = { title:title, date:date, week:week, time:date ? (f.time || '') : '', prio:f.prio, area:area, note:String(f.note || '').trim(), remind:f.remind, remindTime:f.remind === 'time' ? f.remindTime : '' };
  function makeSeries(){
    var sid = 'sr' + uid();
    data.series[sid] = { id:sid, title:fields.title, time:fields.time, prio:fields.prio, area:fields.area, note:fields.note, remind:fields.remind, remindTime:fields.remindTime,
      rep:{ type:rep.type, days:rep.days, n:rep.n }, until:rep.until || '', dom:parseYmd(date).getDate(), start:date, ended:false };
    return sid;
  }
  if (!s.id) {
    var t = Object.assign({ id:'t' + uid(), done:false, createdAt:Date.now() }, fields);
    if (rep.type !== 'none') t.seriesId = makeSeries();
    data.tasks.push(t);
    return closeAndCommit('Tarea añadida');
  }
  var task = byId(data.tasks, s.id); if (!task) return closeAndCommit();
  var ser = activeSeries(task);
  if (ser && !scope) { s.ask = 'save'; s.pending = 'save'; renderSheet(); return; }
  Object.assign(task, fields); task.edited = true;
  if (rep.type !== 'none') {
    if (!ser) task.seriesId = makeSeries();
    else if (scope === 'all') Object.assign(ser, { title:fields.title, time:fields.time, prio:fields.prio, area:fields.area, note:fields.note, remind:fields.remind, remindTime:fields.remindTime,
      rep:{ type:rep.type, days:rep.days, n:rep.n }, until:rep.until || '', dom:parseYmd(date).getDate() });
  } else if (ser && scope === 'all') ser.ended = true;
  closeAndCommit('Tarea guardada');
}
function openTaskSheet(t, preDate){
  var form = taskFormFrom(t);
  if (!t && preDate) { form.dayMode = preDate === today() ? 'today' : preDate === tomorrowDs() ? 'tomorrow' : 'date'; form.date = preDate; }
  openSheet('task', { id:t ? t.id : null, form:form, more:!!(t && (t.note || t.seriesId || t.remind === 'time')) });
}
Object.assign(ACT, {
  'undo-toast': function(){ if (state.toastEntry) runUndo(state.toastEntry); },
  'undo-last': function(){ var s = UNDO.tareas; if (s.length) runUndo(s[s.length - 1]); },
  'form-set': function(ds){
    var f = sheetForm(); if (!f) return;
    var v = ds.v === 'true' ? true : ds.v === 'false' ? false : ds.v;
    setPath(f, ds.f, v); renderSheet();
  },
  'form-day': function(ds){
    var f = sheetForm(); if (!f) return;
    var a = getPath(f, ds.f) || [], d = +ds.day, i = a.indexOf(d);
    if (ds.single) a = [d]; else if (i >= 0) a.splice(i, 1); else a.push(d);
    a.sort(function(x, y){ return x - y; }); setPath(f, ds.f, a); renderSheet();
  },
  'form-more': function(){ state.sheet.more = true; renderSheet(); },
  /* Tareas */
  'task-new': function(ds){ openTaskSheet(null, ds && ds.date); },
  'task-edit': function(ds){ var t = byId(data.tasks, ds.id); if (t) openTaskSheet(t); },
  'task-toggle': function(ds){ toggleTask(ds.id); save(); render(); },
  'task-save': function(){ saveTask(null); },
  'task-del': function(){
    var s = state.sheet, t = byId(data.tasks, s.id); if (!t) return closeAndCommit();
    if (activeSeries(t)) { s.ask = 'del'; renderSheet(); return; }
    deleteTask(t.id, 'one'); state.sheet = null; renderSheet(); save(); render();
  },
  'task-scope': function(ds){
    var s = state.sheet;
    if (ds.scope === 'cancel') { s.ask = null; renderSheet(); return; }
    if (s.ask === 'save') { s.ask = null; saveTask(ds.scope); }
    else { deleteTask(s.id, ds.scope); state.sheet = null; renderSheet(); save(); render(); }
  },
  'ttab': function(ds){ state.ttab = ds.tab; state.tlimit = 40; render(); },
  'tarea': function(ds){ state.tarea = ds.v; render(); },
  'tmore': function(){ state.tlimit = (state.tlimit || 40) + 40; render(); },
  /* Fitness */
  'ftab': function(ds){ if (state.edit === 'fitplan') { finishEdit('fitplan'); state.edit = null; } state.ftab = ds.tab; render(); },
  'ffilter': function(ds){ state.ffilter = ds.v; state.flimit = 30; render(); },
  'fmore': function(){ state.flimit = (state.flimit || 30) + 30; render(); },
  'fit-plan-toggle': function(ds){ if (ds.date > today()) return; var f = findFP(ds.id); if (!f) return; togglePlanSession(f.list[f.idx], ds.date); commit(); },
  'fit-edit-plan': function(){ state.sheet = null; renderSheet(); state.ftab = 'semana'; if (state.edit && state.edit !== 'fitplan') finishEdit(state.edit); state.edit = 'fitplan'; state.keepEdit = true; go('fitness'); },
  'session-new': function(ds){ openSheet('session', { form:{ type:'gym', name:'', date:(ds && ds.date) || today(), dur:'60', dist:'', notes:'', done:true } }); },
  'session-edit': function(ds){ var x = byId(data.fitness.sessions, ds.id); if (!x) return; openSheet('session', { id:x.id, form:{ type:x.type, name:x.name || '', date:x.date, dur:String(x.dur || ''), dist:numStr(x.dist), notes:x.notes || '', done:!!x.done } }); },

/* ---------- Copia de seguridad ---------- */
/* Fuera del visor de Claude (por ejemplo, alojada en tu propia web) se puede descargar con un enlace normal */
function standalone(){ return !(window.claude && typeof window.claude.use === 'function'); }
function localDownload(name, text, mime){
  try {
    var url = URL.createObjectURL(new Blob([text], { type:mime }));
    var a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    return true;
  } catch (e) { return false; }
}
var CAP = { downloads:null };
function initCaps(){
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function(dl){ CAP.downloads = dl || null; if (state.route === 'ajustes') render(); }).catch(function(){ CAP.downloads = null; });
    }
  } catch (e) { CAP.downloads = null; }
}
function backupDays(){
  var b = data.settings.backup; if (!b.remind) return null;
  var t = now().getTime();
  if (b.snoozeUntil && t < b.snoozeUntil) return null;
  if (b.lastExport) { var d1 = Math.floor((t - b.lastExport) / 864e5); return d1 > 7 ? d1 : null; }
  var d2 = Math.floor((t - (data.createdAt || t)) / 864e5); return d2 > 3 ? d2 : null;
}
function cardBackup(){
  var n = backupDays(); if (n == null) return '';
  return '<section class="card backup" aria-label="Copia de seguridad"><p class="h3">Hace ' + n + ' días que no exportas tu copia</p><p class="muted small mt-s">Tus datos solo están en este dispositivo. Una copia te protege si cambias de versión o de iPhone.</p>' +
    '<div class="btnrow mt"><button class="btn primary" data-act="backup-export">Exportar ahora</button><button class="btn ghost" data-act="backup-later">Más tarde</button></div></section>';
}
function backupJson(){ return JSON.stringify({ app:'LEVEL UP', exportedAt:new Date().toISOString(), data:data }); }
function markExported(){ data.settings.backup.lastExport = now().getTime(); data.settings.backup.snoozeUntil = 0; save(); }
function exportBackup(){
  var json = backupJson(), name = 'levelup-copia-' + today() + '.json';
  if (CAP.downloads) {
    CAP.downloads.save({ filename:name, data:json }).then(function(){ markExported(); toast('Copia guardada en tu dispositivo'); render(); }).catch(function(e){
      var c = e && e.code;
      if (c === 'declined') toast('Guardado cancelado. La copia no se ha marcado como hecha.');
      else if (c === 'rate_limited') toast('Ya hay un guardado abierto. Inténtalo en un momento.');
      else { CAP.downloads = null; openSheet('exportText', { json:json }); }
    });
  } else if (standalone() && localDownload(name, json, 'application/json')) openSheet('dlConfirm', { what:'backup' });
  else openSheet('exportText', { json:json });
}
function validateBackup(text){
  var o;
  try { o = JSON.parse(text); } catch (e) { return { error:'El texto no es una copia válida (no se puede leer como JSON).' }; }
  if (!isObj(o)) return { error:'El archivo no tiene el formato de una copia de LEVEL UP.' };
  var d = o.app === 'LEVEL UP' && isObj(o.data) ? o.data : o;
  if (!isObj(d) || typeof d.version !== 'number' || !isObj(d.settings) || !isObj(d.routines)) return { error:'Faltan datos esenciales: no parece una copia de LEVEL UP.' };
  if (d.version > VERSION) return { error:'Esta copia es de una versión más nueva de la app.' };
  var bad = [['habits','array'], ['tasks','array'], ['log','array'], ['journal','object']].filter(function(x){ return d[x[0]] != null && (x[1] === 'array' ? !Array.isArray(d[x[0]]) : !isObj(d[x[0]])); });
  if (bad.length) return { error:'La copia está dañada (' + bad.map(function(x){ return x[0]; }).join(', ') + ').' };
  var count = function(a){ return Array.isArray(a) ? a.length : 0; };
  var summary = [
    ['Hábitos', count(d.habits)], ['Tareas', count(d.tasks)], ['Entradas de diario', isObj(d.journal) ? Object.keys(d.journal).length : 0],
    ['Sesiones de entreno', d.fitness ? count(d.fitness.sessions) : 0], ['Piezas de Instagram', d.instagram ? count(d.instagram.pieces) : 0],
    ['Elementos de wishlist', d.wishlist ? count(d.wishlist.items) : 0], ['Registros de actividad', count(d.log)]
  ];
  return { data:d, exportedAt:o.exportedAt || null, summary:summary };
}

  pctRow('Rutina nocturna', cnt('rutina', function(r, d){ return nIds[r] && nightDue(parseYmd(d)); }), nT);

/* ---------- Dictado ---------- */
function dictKeyOf(el){ var d = el.dataset; return [d.in, d.f, d.date || '', d.wk || '', d.id || ''].join('|'); }
function findDictEl(key){ var l = document.querySelectorAll('[data-dict]'); for (var i = 0; i < l.length; i++) if (dictKeyOf(l[i]) === key) return l[i]; return null; }
function enhanceDictation(root){
  if (!CAP.dictation || data.settings.dictDenied) return;
  (root || document).querySelectorAll('[data-dict]').forEach(function(el){
    var wrap = el.closest('.field') || el.parentNode;
    if (!wrap || wrap.querySelector('.mic')) return;
    wrap.classList.add('has-mic');
    var key = dictKeyOf(el), listening = state.dictKey === key && state.dictOn;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'mic' + (listening ? ' listening' : ''); b.dataset.act = 'dict'; b.dataset.key = key;
    b.setAttribute('aria-label', listening ? 'Parar el dictado' : 'Dictar'); b.setAttribute('aria-pressed', listening ? 'true' : 'false');
    b.innerHTML = ICON.mic; wrap.appendChild(b);
    var p = document.createElement('span'); p.className = 'dict-partial'; p.dataset.key = key; p.setAttribute('aria-live', 'polite'); wrap.appendChild(p);
  });
}
function updateMics(){
  document.querySelectorAll('.mic').forEach(function(b){ var on_ = state.dictOn && b.dataset.key === state.dictKey; b.classList.toggle('listening', on_); b.setAttribute('aria-pressed', on_ ? 'true' : 'false'); b.setAttribute('aria-label', on_ ? 'Parar el dictado' : 'Dictar'); });
  if (!state.dictOn) document.querySelectorAll('.dict-partial').forEach(function(p){ p.textContent = ''; });
}
function dictDeny(){ CAP.dictation = null; data.settings.dictDenied = true; save(); document.querySelectorAll('.mic,.dict-partial').forEach(function(x){ x.remove(); }); toast('Dictado desactivado. Usa el micrófono del teclado.'); }
function setupDictation(d){
  CAP.dictation = d;
  d.onPartial(function(e){ var p = document.querySelector('.dict-partial[data-key="' + (state.dictKey || '').replace(/"/g, '') + '"]'); if (p) p.textContent = e.text || ''; });
  d.onFinal(function(e){
    var el = findDictEl(state.dictKey); if (!el || !e.text) return;
    var t = e.text; if (!el.value) t = t.replace(/^\s+/, '');
    el.value += t; el.dispatchEvent(new Event('input', { bubbles:true }));
    if (el.tagName === 'TEXTAREA') autosize(el);
  });
  d.onState(function(e){
    state.dictOn = e.state !== 'idle'; updateMics();
    if (e.state === 'idle') {
      if (e.reason === 'not_granted') dictDeny();
      else if (e.reason === 'unavailable') { CAP.dictation = null; document.querySelectorAll('.mic,.dict-partial').forEach(function(x){ x.remove(); }); }
      else if (e.reason === 'upstream_error' || e.reason === 'rate_limited') toast('El dictado no ha funcionado. Inténtalo de nuevo.');
    }
  });
  render();
}
ACT['dict'] = function(ds){
  var d = CAP.dictation; if (!d) return;
  if (d.active() && state.dictKey === ds.key) { d.stop().catch(function(){}); return; }
  state.dictKey = ds.key;
  var p = d.start(); /* directamente desde el clic, sin esperar nada antes */
  p.catch(function(err){
    var c = err && err.code;
    if (c === 'not_granted') dictDeny();
    else if (c === 'unavailable') { CAP.dictation = null; document.querySelectorAll('.mic,.dict-partial').forEach(function(x){ x.remove(); }); }
    else if (c !== 'dismissed' && c !== 'stopped') toast('No se pudo empezar a dictar.');
  });
};

function asstResult(s){

function asstError(e){
  var c = e && e.code;
  if (c === 'cancelled') return null;

  if (c === 'rate_limited') return 'Has hecho muchas peticiones seguidas. Espera un poco y vuelve a intentarlo.';
  if (c === 'invalid_json') return 'La respuesta no tenía el formato esperado. Puedes intentarlo otra vez.';
  if (c === 'refused') return 'Claude no ha podido responder a esto. Prueba a escribirlo de otra forma.';
  if (c === 'session_expired') return 'Tu sesión de Claude ha caducado. Vuelve a iniciar sesión.';

Object.assign(ACT, {
